manifold:
  name: octahedron
  n_points: 800
  seed: 0
model:
  emb_dim: 32
  hidden_dim: 128
  num_heads: 4
  num_layers: 2
  dropout: 0.0
  normalize_embeddings: false
training:
  tasks:
  - distance
  init_checkpoint: models/pretrained/octahedron_same_triangle_n800_50k.pt
  freeze:
  - emb
  - transformer
  finetune_pool_points: 600
  train_examples: 50000
  batch_size: 256
  steps: 50000
  learning_rate: 0.001
  weight_decay: 0.0001
  seed: 0
  progress_interval: 500
  test_fraction: 0.1
