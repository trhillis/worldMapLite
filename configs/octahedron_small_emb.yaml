# Distance-only transformer training on the octahedron manifold - same as
# octahedron_long.yaml (50000 steps) but with a much smaller emb_dim (8 vs
# 32), to test experiment 005's open question in
# experiments/manifold_learning/octahedron/EXPERIMENTS.md: does a smaller
# embedding table reach the same delayed-plateau nearest-neighbor-recall /
# intrinsic-dimension shape faster, since it has fewer spare dimensions for
# the model to spread variance into?
#
# Run with:
#   python -m src.train_manifold configs/octahedron_small_emb.yaml

manifold:
  name: octahedron       # looked up via manifolds.get_manifold()
  n_points: 800           # manifolds/README.md's recommended default
  seed: 0

model:
  emb_dim: 8              # was 32 in octahedron_default.yaml/octahedron_long.yaml
  hidden_dim: 128
  num_heads: 4
  num_layers: 2
  dropout: 0.0
  normalize_embeddings: false

training:
  train_examples: 50000
  batch_size: 256
  steps: 50000
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  seed: 0
  progress_interval: 500  # steps between embedding-quality snapshots; 0 disables
