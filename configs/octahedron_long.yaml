# Distance-only transformer training on the octahedron manifold - a longer
# run than octahedron_default.yaml (50000 vs 10000 steps), to see whether
# metrics that hadn't plateaued by step 10000 (nearest-neighbor recall,
# embedding intrinsic dimension - see experiments/manifold_learning/octahedron/
# EXPERIMENTS.md, experiment 004) eventually flatten out or keep drifting.
#
# Run with:
#   python -m src.train_manifold configs/octahedron_long.yaml

manifold:
  name: octahedron       # looked up via manifolds.get_manifold()
  n_points: 800           # manifolds/README.md's recommended default
  seed: 0

model:
  emb_dim: 32
  hidden_dim: 128
  num_heads: 4
  num_layers: 2
  dropout: 0.0
  normalize_embeddings: false

training:
  train_examples: 50000
  batch_size: 256
  steps: 50000
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  seed: 0
  progress_interval: 500  # steps between embedding-quality snapshots; 0 disables
  test_fraction: 0.1  # fraction of all C(n_points, 2) pairs reserved as a held-out generalization check
