# same_triangle-only transformer training on the octahedron manifold - full
# size (same n_points/steps as octahedron_default.yaml, so results are
# directly comparable). No distance signal at all: this checks whether
# triangle/face structure emerges in the embedding from the same_triangle
# task alone (see analysis/analysis_manifold.py's embedding_pca.png,
# colored by chart_points[:, 0] i.e. face index).
#
# Run with:
#   python -m src.train_manifold configs/octahedron_same_triangle.yaml

manifold:
  name: octahedron       # looked up via manifolds.get_manifold()
  n_points: 800           # manifolds/README.md's recommended default
  seed: 0

model:
  emb_dim: 32
  hidden_dim: 128
  num_heads: 4
  num_layers: 2
  dropout: 0.0
  normalize_embeddings: false

training:
  tasks: [same_triangle]
  train_examples: 50000
  batch_size: 256
  steps: 10000
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  seed: 0
  progress_interval: 500  # steps between embedding-quality snapshots; 0 disables
  test_fraction: 0.1  # fraction of all C(n_points, 2) pairs reserved as a held-out generalization check
