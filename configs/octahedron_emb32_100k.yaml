# Distance-only transformer training on the octahedron manifold - same as
# octahedron_long.yaml (emb_dim=32, 800 points) but with 100000 steps (2x)
# instead of 50000, to test experiment 009's undertraining hypothesis
# (experiments/manifold_learning/octahedron/EXPERIMENTS.md): does emb_dim=32
# eventually catch up to or surpass emb_dim=24's 50000-step numbers given
# more steps, or does emb_dim=24 genuinely win at a shared training budget?
#
# Run with:
#   python -m src.train_manifold configs/octahedron_emb32_100k.yaml

manifold:
  name: octahedron       # looked up via manifolds.get_manifold()
  n_points: 800           # manifolds/README.md's recommended default
  seed: 0

model:
  emb_dim: 32
  hidden_dim: 128
  num_heads: 4
  num_layers: 2
  dropout: 0.0
  normalize_embeddings: false

training:
  train_examples: 50000
  batch_size: 256
  steps: 100000
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  seed: 0
  progress_interval: 500  # steps between embedding-quality snapshots; 0 disables
