# Point-pool sweep, point 3/10: frozen same_triangle-embedding distance
# probe (mirror of same_triangle_points_sweep/octahedron_pts30_frozen_ft.yaml,
# using the same methodology as octahedron_distance_frozen_ft.yaml /
# EXPERIMENTS.md entry 102), except training pairs are restricted to a
# fixed 30-point pool (training.finetune_pool_points) instead of drawn
# from all 800 points. test_pairs (the held-out generalization check) is
# NOT restricted - it's still drawn from all 800 points, so held-out
# loss/Spearman here measures whether a distance head fine-tuned on only
# 30 points' pairs generalizes to the *entire* point set, using nothing
# but the frozen, already-well-trained same_triangle embedding of the
# points it never saw a distance label for.
#
# Uses the already-backed-up same_triangle-only pretrain checkpoint at
# models/pretrained/octahedron_same_triangle_n800_50k.pt (produced for
# experiments 099/102, 800 points/emb_dim=32/50000 steps/seed 0) - no
# fresh pretrain/backup step is needed here.
#
# Run with:
#   python -u -m src.train_manifold configs/distance_points_sweep/octahedron_pts30_frozen_ft.yaml

manifold:
  name: octahedron       # looked up via manifolds.get_manifold()
  n_points: 800           # must match the init_checkpoint's manifold
  seed: 0                 # must match the init_checkpoint's seed

model:
  emb_dim: 32              # must match the init_checkpoint's model_cfg
  hidden_dim: 128
  num_heads: 4
  num_layers: 2
  dropout: 0.0
  normalize_embeddings: false

training:
  tasks: [distance]
  init_checkpoint: models/pretrained/octahedron_same_triangle_n800_50k.pt
  freeze: [emb, transformer]
  finetune_pool_points: 30
  train_examples: 50000
  batch_size: 256
  steps: 20000
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  seed: 0
  progress_interval: 500  # steps between embedding-quality snapshots; 0 disables
  test_fraction: 0.1  # fraction of all C(n_points, 2) pairs reserved as a held-out generalization check
