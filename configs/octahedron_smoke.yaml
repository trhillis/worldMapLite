# Tiny smoke-test config: confirms the pipeline runs end-to-end and loss
# decreases, before committing to the full octahedron_default.yaml run
# (which has a multi-minute one-time geodesic precompute at n_points=800).
#
# Run with:
#   python -m src.train_manifold configs/octahedron_smoke.yaml

manifold:
  name: octahedron
  n_points: 50
  seed: 0

model:
  emb_dim: 32
  hidden_dim: 128
  num_heads: 4
  num_layers: 2
  dropout: 0.0
  normalize_embeddings: false

training:
  train_examples: 2000
  batch_size: 64
  steps: 500
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  seed: 0
  progress_interval: 100  # steps between embedding-quality snapshots; 0 disables
