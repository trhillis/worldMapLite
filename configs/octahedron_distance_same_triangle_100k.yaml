# Same as octahedron_distance_same_triangle.yaml (see experiment 076 in
# experiments/manifold_learning/octahedron/EXPERIMENTS.md) but with 10x the
# training steps (100000 instead of 10000), to check whether 076's bulk
# embedding-quality degradation (vs. distance-only 002/004) is a
# training-budget artifact or persists with much more training.
#
# Run with:
#   python -m src.train_manifold configs/octahedron_distance_same_triangle_100k.yaml

manifold:
  name: octahedron
  n_points: 800
  seed: 0

model:
  emb_dim: 32
  hidden_dim: 128
  num_heads: 4
  num_layers: 2
  dropout: 0.0
  normalize_embeddings: false

training:
  tasks: [distance, same_triangle]
  train_examples: 50000
  batch_size: 256
  steps: 100000
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  seed: 0
  progress_interval: 500  # steps between embedding-quality snapshots; 0 disables
  test_fraction: 0.1  # fraction of all C(n_points, 2) pairs reserved as a held-out generalization check
  # distance_weight / same_triangle_weight omitted - both default to 1.0
