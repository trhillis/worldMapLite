# same_triangle_weight low-weight extension, 50000 steps: continues 088's
# finding that same_triangle_weight=0.01 (20000 steps) beat every point in
# the original 0.1-1.0 sweep (078-087) - this tests weights an order of
# magnitude apart below 0.1 (0.01, 0.001, 0.0001, 0.00001), all at a
# shared 50000-step budget (matching 089/090's step-budget follow-ups), to
# find where the "lower weight keeps helping" trend from 088 saturates or
# reverses, and where same_triangle's own task quality starts to suffer
# from too little gradient signal.
#
# Run with:
#   python -u -m src.train_manifold configs/same_triangle_weight_sweep/octahedron_stw_0.01_50k.yaml

manifold:
  name: octahedron
  n_points: 800
  seed: 0

model:
  emb_dim: 32
  hidden_dim: 128
  num_heads: 4
  num_layers: 2
  dropout: 0.0
  normalize_embeddings: false

training:
  tasks: [distance, same_triangle]
  train_examples: 50000
  batch_size: 256
  steps: 50000
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  seed: 0
  progress_interval: 500
  test_fraction: 0.1
  same_triangle_weight: 0.01
  # distance_weight omitted - defaults to 1.0
